name: infographic_app
description: "Infographica - Educational Infographic Library"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.2.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  photo_view: ^0.14.0
  flutter_staggered_animations: ^1.0.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/physics/
    - assets/data/
