name: infographic_app
description: "Infographica - Educational Infographic Library"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.2.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  photo_view: ^0.14.0
  flutter_staggered_animations: ^1.0.0
  path_provider: ^2.1.2
  dio: ^5.4.3
  share_plus: ^10.1.1
  permission_handler: ^11.3.1
  gal: ^2.3.1
  flutter_local_notifications: ^17.2.1
  workmanager: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/infographics/biology/
    - assets/infographics/environment/
    - assets/infographics/geography/
    - assets/infographics/history/
    - assets/infographics/mathematics/
    - assets/infographics/physics/
    - assets/infographics/science/
    - assets/infographics/technology/
    - assets/data/india/
    - assets/data/world/
